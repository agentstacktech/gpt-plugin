openapi: 3.1.0
info:
  title: AgentStack MCP API
  description: 'AgentStack backend ecosystem: 8DNA hierarchical data, Rules Engine,
    Buffs (trials/subscriptions), Payments, Agents Fleet, AI Builder, Storage, Support,
    RAG, and one MCP tool (agentstack.execute). The live action catalog is the source
    of truth — call GET /mcp/actions, GET /mcp/organs (domain playbooks), or consult
    docs/MCP_CAPABILITY_MATRIX.md. Keep this OpenAPI small for GPT Actions: discover
    first, then execute exact action names through POST /mcp.'
  version: 0.4.26
  contact:
    name: AgentStack
servers:
- url: https://agentstack.tech
  description: Production MCP server
paths:
  /mcp:
    post:
      operationId: execute_tool
      summary: Execute an AgentStack MCP tool
      description: Call a registered AgentStack action by exact name with parameters.
        Discover allowed action names first with list_actions or docs/MCP_CAPABILITY_MATRIX.md.
        Ask the user for confirmation before destructive, money-moving, or access-changing
        mutations.
      x-openai-isConsequential: true
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tool
              properties:
                tool:
                  type: string
                  description: Full MCP tool name (e.g. projects.create_project_anonymous,
                    projects.get_projects).
                params:
                  type: object
                  description: Key-value parameters for the tool. Schema depends on
                    the tool; discover via GET /mcp/actions or MCP_CAPABILITY_MATRIX.
                  additionalProperties: true
                context:
                  type: object
                  description: Optional execute context (OAuth keys often bind to
                    a default ecosystem project). Use project_id for tenant-scoped
                    GPTs.
                  properties:
                    project_id:
                      type: integer
                      description: Tenant project id. OAuth often binds ecosystem
                        project 1; set this for a tenant.
                    user_id:
                      type: integer
                      description: Caller user id. Usually taken from the session.
                    generation_env_uuid:
                      type: string
                      description: Sandbox anchor for this call. Not a recipe input.
                  additionalProperties: true
                options:
                  type: object
                  description: batch.v1 controls.
                  properties:
                    async:
                      type: boolean
                      description: Queue; poll discovery.job_status.
                    workflow_run_id:
                      type: string
                      description: Inverse workflow run id.
                    goal:
                      type: string
                      description: Goal text for playbook.
                    observed:
                      type: object
                      description: workflow_runtime.observed echo.
                      properties:
                        completed_steps:
                          type: array
                          description: Done step ids.
                          items:
                            type: string
                        workflow_revision:
                          type: integer
                          description: Cursor revision.
                        succeeded:
                          type: array
                          description: Succeeded actions.
                          items:
                            type: string
                        workflow_state_key:
                          type: object
                          description: Guidance binding key.
                          properties:
                            workflow_run_id:
                              type: string
                              description: Run id.
                            project_id:
                              type: integer
                              description: Project.
                            principal_id:
                              type: integer
                              description: User.
                            graph_home:
                              type: string
                              description: project|user.
                          additionalProperties: true
                        goal_verification:
                          type: object
                          description: Release criteria.
                          additionalProperties: true
                        evidence:
                          type: object
                          description: Playbook evidence.
                          additionalProperties: true
                        current_step_id:
                          type: string
                          description: Active step id.
                      additionalProperties: true
                    density:
                      type: string
                      description: strict|guided|autonomous
                      enum:
                      - strict
                      - guided
                      - autonomous
                    enforce_approval:
                      type: boolean
                      description: Pause risky steps.
                    stopOnError:
                      type: boolean
                      description: Stop on first failure.
                    continueOnError:
                      type: boolean
                      description: Continue after failure.
                    executionMode:
                      type: string
                      description: sequential|dag|smart
                      enum:
                      - sequential
                      - dag
                      - smart
                    goal_text:
                      type: string
                      description: Alias for goal.
                    focus_node_id:
                      type: string
                      description: Graph node from work_next.
                    plan_execute_mode:
                      type: boolean
                      description: Bind plan_execute lane.
                    execution_intent:
                      type: string
                      description: direct | workflow | validate — typed batch lane.
                      enum:
                      - direct
                      - workflow
                      - validate
                    routed_goal:
                      type: object
                      description: Routed goal snapshot.
                      properties:
                        intent_id:
                          type: string
                          description: Intent id.
                        goal_text:
                          type: string
                          description: Goal text.
                        response_mode:
                          type: string
                          description: tools|workflow.
                        step_actions:
                          type: array
                          description: Suggested actions.
                          items:
                            type: string
                        semantic_contract:
                          type: object
                          description: Effect constraints.
                          additionalProperties: true
                      additionalProperties: true
                    semantic_strict:
                      type: boolean
                      description: Enforce goal anchor match.
                    envelope:
                      type: string
                      description: compact (default) | full — ADR MCP_EXECUTE_ENVELOPE_COMPACT_V2
                      enum:
                      - compact
                      - full
                    instruction_hash:
                      type: string
                      description: Batch instruction_packet hash from prior response;
                        omit duplicate instruction tail when unchanged.
                    recipe_id:
                      type: string
                      description: MCP recipe id.
                    recipe_params:
                      type: object
                      description: Recipe params.
                      additionalProperties: true
                    idempotency_key:
                      type: string
                      description: Retry receipt key.
                  additionalProperties: true
            examples:
              create_project:
                summary: Create anonymous project
                value:
                  tool: projects.create_project_anonymous
                  params:
                    name: My GPT Project
              get_projects:
                summary: List projects
                value:
                  tool: projects.get_projects
                  params: {}
              knowledge_playground:
                summary: Mentor playground (tenant project scope)
                value:
                  tool: knowledge.playground
                  params:
                    text: Привет, я новичок
                  context:
                    project_id: 1444
      responses:
        '200':
          description: Tool executed successfully. Response shape depends on the tool.
          content:
            application/json:
              schema:
                type: object
                description: Tool result (success, data, or error details).
        '400':
          description: Bad request (e.g. missing tool name or invalid params).
        '401':
          description: Missing or invalid API key/OAuth token.
        '404':
          description: Tool name not found in registry.
  /mcp/actions:
    get:
      operationId: list_actions
      summary: List available AgentStack MCP actions
      description: Discovery endpoint for action names, summaries, categories, and
        required capabilities. Use before executing an unfamiliar action. Supports
        If-None-Match / since_etag conditional GET; optional delta=1 partial body.
      x-openai-isConsequential: false
      parameters:
      - name: since_etag
        in: query
        required: false
        schema:
          type: string
        description: Previous catalog_etag; returns 304 when unchanged.
      - name: delta
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
          - 'true'
        description: With stale since_etag, return changed/added rows when revision
          known; else full catalog with delta_fallback=revision_unknown.
      - name: schemas
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - public
          - hot
          - all
          default: none
        description: 'inputSchema attachment: none (default, no JSON schemas), public,
          hot (descriptor pilots), or all.'
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      responses:
        '200':
          description: Action catalog (full, partial delta, or full with delta_fallback).
          headers:
            ETag:
              schema:
                type: string
              description: Current catalog_etag digest.
            X-Catalog-Delta:
              schema:
                type: string
              description: revision_unknown when delta=1 but prior etag not in revision
                store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '304':
          description: Catalog unchanged (since_etag or If-None-Match matches).
  /mcp/ai_prompt:
    get:
      operationId: get_ai_prompt
      summary: Session bootstrap instructions for MCP agents
      description: Returns system_prompt and discovery pointers. Use mode=contract
        for the 8 KiB bootstrap; mode=full for workflows and extended pointers.
      x-openai-isConsequential: false
      parameters:
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - contract
          - full
          default: full
        description: contract = slim bootstrap; full = extended guidance.
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      responses:
        '200':
          description: AI prompt payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /mcp/preflight:
    get:
      operationId: mcp_preflight
      summary: Tenant mutation preflight (parity with preflight.check)
      description: Shared build_preflight_check_data spine — supply, RBAC, optional
        action risk/effect_policy_allowed. Pass goal_text via MCP tool; REST uses
        query params.
      x-openai-isConsequential: false
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: integer
      - name: permission
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: action_params
        in: query
        schema:
          type: string
        description: JSON object for FAP path probe
      - name: path_updates
        in: query
        schema:
          type: string
        description: JSON array of {path, role?} FAP probes
      - name: publish_asked
        in: query
        schema:
          type: boolean
      - name: goal_text
        in: query
        schema:
          type: string
        description: Goal text for effect_policy probe
      - name: semantic_contract
        in: query
        schema:
          type: string
        description: JSON fingerprinted semantic_contract
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      responses:
        '200':
          description: Preflight envelope (PREFLIGHT_CHECK_RETURNS).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /mcp/discover/by_intent:
    get:
      operationId: discover_by_intent_get
      summary: Discover by intent (GET, read-only)
      description: Query-string parity with POST body for intent discovery (q, query,
        intent, search, project_id, semantic_contract, observed).
      x-openai-isConsequential: false
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      parameters:
      - name: intent
        in: query
        schema:
          type: string
      - name: query
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: category
        in: query
        schema:
          type: string
      - name: tokens
        in: query
        schema:
          type: string
      - name: project_id
        in: query
        schema:
          type: integer
      - name: semantic_contract
        in: query
        schema:
          type: string
        description: JSON GoalSemanticContract
      - name: observed
        in: query
        schema:
          type: string
        description: JSON inverse orchestration slots
      responses:
        '200':
          description: Ranked intent rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: discover_by_intent
      summary: Rank MCP actions for a natural-language goal
      description: Intent-first discovery when hot-path table is insufficient. Returns
        ranked intents with primary_tool and instruction_slice hints.
      x-openai-isConsequential: false
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - intent
              properties:
                intent:
                  type: string
                  description: Natural-language user goal.
                project_id:
                  type: integer
                  description: Optional project scope for tenant routing.
      responses:
        '200':
          description: Ranked intent rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /mcp/organs:
    get:
      operationId: list_organs
      summary: Organ self-description index for MCP domains
      description: Returns mcp.<domain> organs with genetic tags, MCP prefixes, and
        neural_actions (linked playbook prompts). Complements list_actions.
      x-openai-isConsequential: false
      security:
      - ApiKeyAuth: []
      - OAuth2Auth:
        - mcp:execute
      responses:
        '200':
          description: Organ index returned successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /mcp/manifest:
    get:
      operationId: get_manifest
      summary: MCP server manifest for registry publish
      description: 'Machine-readable server manifest: protocol versions, catalog counts,
        onboarding pointers.'
      x-openai-isConsequential: false
      responses:
        '200':
          description: Manifest JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key from AgentStack (anonymous project or account). Get one
        via MCP_QUICKSTART.
    OAuth2Auth:
      type: oauth2
      description: OAuth2 Authorization Code + PKCE flow via the AgentStack OAuth
        server. API-key authentication remains the simplest Custom GPT setup path.
      flows:
        authorizationCode:
          authorizationUrl: https://agentstack.tech/api/oauth2/authorize
          tokenUrl: https://agentstack.tech/api/oauth2/token
          scopes:
            mcp:execute: Execute AgentStack MCP actions
            projects:read: Read projects
            projects:write: Create or update projects
